<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>House Price Predictor</title>
 <style>
 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 }

 body {
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
 min-height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 padding: 20px;
 }

.container {
 background: white;
 border-radius: 16px;
 box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
 padding: 40px;
 max-width: 600px;
 width: 100%;
 }

 h1 {
 text-align: center;
 color: #333;
 font-size: 28px;
 margin-bottom: 8px;
 }

.subtitle {
 text-align: center;
 color: #777;
 font-size: 14px;
 margin-bottom: 24px;
 }

.form-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 16px;
 }

.form-group {
 display: flex;
 flex-direction: column;
 }

.form-group.full-width {
 grid-column: span 2;
 }

 label {
 font-size: 13px;
 font-weight: 600;
 color: #555;
 margin-bottom: 4px;
 }

 input {
 padding: 10px 12px;
 border: 1px solid #ddd;
 border-radius: 8px;
 font-size: 14px;
 transition: border-color 0.2s, box-shadow 0.2s;
 outline: none;
 }

 input:focus {
 border-color: #667eea;
 box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
 }

 input::placeholder {
 color: #bbb;
 }

 button {
 grid-column: span 2;
 padding: 14px;
 background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
 color: white;
 border: none;
 border-radius: 10px;
 font-size: 16px;
 font-weight: 600;
 cursor: pointer;
 transition: transform 0.15s, box-shadow 0.15s;
 margin-top: 8px;
 }

 button:hover {
 transform: translateY(-2px);
 box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
 }

 button:active {
 transform: translateY(0);
 }

.result-box {
 margin-top: 24px;
 padding: 20px;
 background: #f8f9ff;
 border-radius: 12px;
 text-align: center;
 border: 2px dashed #667eea;
 display: none;
 }

.result-box.show {
 display: block;
 }

.result-label {
 font-size: 14px;
 color: #888;
 margin-bottom: 4px;
 }

 #result {
 font-size: 32px;
 font-weight: 700;
 color: #333;
 }

 #result.loading {
 color: #999;
 font-size: 18px;
 }

.error {
 color: #e74c3c;
 font-size: 14px;
 margin-top: 12px;
 text-align: center;
 }

 @media (max-width: 500px) {
.container {
 padding: 24px;
 }

.form-grid {
 grid-template-columns: 1fr;
 }

.form-group.full-width,
 button {
 grid-column: span 1;
 }

 h1 {
 font-size: 22px;
 }

 #result {
 font-size: 26px;
 }
 }
 </style>
</head>
<body>
 <div class="container">
 <h1>🏠 House Price Estimator</h1>
 <p class="subtitle">Enter the details below to get a predicted market price</p>

 <form id="pred-form">
 <div class="form-grid">
 <div class="form-group">
 <label for="bedrooms">Bedrooms</label>
 <input id="bedrooms" name="bedrooms" type="number" step="0.5" placeholder="e.g. 3" required>
 </div>

 <div class="form-group">
 <label for="bathrooms">Bathrooms</label>
 <input id="bathrooms" name="bathrooms" type="number" step="0.5" placeholder="e.g. 2" required>
 </div>

 <div class="form-group">
 <label for="sqft_living">Sqft Living</label>
 <input id="sqft_living" name="sqft_living" type="number" placeholder="e.g. 1500" required>
 </div>

 <div class="form-group">
 <label for="sqft_lot">Sqft Lot</label>
 <input id="sqft_lot" name="sqft_lot" type="number" placeholder="e.g. 5000" required>
 </div>

 <div class="form-group">
 <label for="floors">Floors</label>
 <input id="floors" name="floors" type="number" step="0.5" placeholder="e.g. 1" required>
 </div>

 <div class="form-group">
 <label for="waterfront">Waterfront</label>
 <input id="waterfront" name="waterfront" type="number" step="0.5" placeholder="0 or 1" required>
 </div>

 <div class="form-group">
 <label for="view">View</label>
 <input id="view" name="view" type="number" step="0.5" placeholder="e.g. 0" required>
 </div>

 <div class="form-group">
 <label for="condition">Condition</label>
 <input id="condition" name="condition" type="number" step="0.5" placeholder="1–5" required>
 </div>

 <div class="form-group">
 <label for="yr_built">Year Built</label>
 <input id="yr_built" name="yr_built" type="number" placeholder="e.g. 1990" required>
 </div>

 <div class="form-group">
 <label for="yr_renovated">Year Renovated</label>
 <input id="yr_renovated" name="yr_renovated" type="number" placeholder="0 if never" required>
 </div>

 <div class="form-group">
 <label for="year">Year</label>
 <input id="year" name="year" type="number" placeholder="e.g. 2026" required>
 </div>

 <div class="form-group">
 <label for="month">Month</label>
 <input id="month" name="month" type="number" placeholder="e.g. 6" required>
 </div>

 <div class="form-group">
 <label for="age">Age</label>
 <input id="age" name="age" type="number" placeholder="e.g. 36" required>
 </div>

 <div class="form-group">
 <label for="is_renovated">Is Renovated</label>
 <input id="is_renovated" name="is_renovated" type="number" step="0.5" placeholder="0 or 1" required>
 </div>

 <div class="form-group full-width">
 <label for="city_mean_price">City Mean Price</label>
 <input id="city_mean_price" name="city_mean_price" type="number" placeholder="e.g. 450000" required>
 </div>

 <button type="submit">💰 Predict Price</button>
 </div>
 </form>

 <div class="result-box" id="result-box">
 <div class="result-label">Estimated Market Price</div>
 <div id="result">—</div>
 <div class="error" id="error-msg"></div>
 </div>
 </div>

 <script>
 document.getElementById('pred-form').addEventListener('submit', async (e) => {
 e.preventDefault();

 const resultBox = document.getElementById('result-box');
 const resultEl = document.getElementById('result');
 const errorEl = document.getElementById('error-msg');
 const btn = e.target.querySelector('button');

 // Show loading state
 resultBox.classList.add('show');
 resultEl.textContent = 'Calculating...';
 resultEl.className = 'loading';
 errorEl.textContent = '';
 btn.disabled = true;
 btn.textContent = '⏳ Predicting...';

 const formData = new FormData(e.target);
 const data = Object.fromEntries(formData.entries());

 // Convert to numbers
 for (let key in data) {
 data[key] = parseFloat(data[key]);
 }

 try {
 const res = await fetch('http://127.0.0.1:8000/predict', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify(data)
 });

 if (!res.ok) {
 throw new Error(`Server error: ${res.status}`);
 }

 const result = await res.json();
 resultEl.textContent = `$${result.predicted_price.toLocaleString()}`;
 resultEl.className = '';
 } catch (err) {
 resultEl.textContent = 'Error';
 resultEl.className = '';
 errorEl.textContent = err.message || 'Something went wrong. Try again.';
 } finally {
 btn.disabled = false;
 btn.textContent = '💰 Predict Price';
 }
 });
 </script>
</body>
</html>
